<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080A">
<title>Wasted | VI Countdown</title>
<script>
/* GitHub Pages serves this file for any missing path, at that path, so a
   relative URL from /VICountdown/a/b/c would point at /VICountdown/a/b/.
   Pin every relative URL to the site root before anything else loads:
   the first path segment on *.github.io (a project site), "/" elsewhere. */
(function(){
  var root = '/';
  if (/\.github\.io$/i.test(location.hostname)){
    var m = location.pathname.match(/^\/[^\/]+\//);
    if (m) root = m[0];
  }
  var b = document.createElement('base');
  b.href = root;
  document.head.appendChild(b);
})();
</script>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&amp;family=Anton&amp;display=swap">
<style>
@font-face{
  font-family:'Pricedown';
  src:local('Pricedown Bl'), local('Pricedown Black'), local('Pricedown'), local('pricedown bl');
  font-display:swap;
}
:root{
  --black:#08080A;
  --white:#FFFFFF;
  --pink:#FF2DAA;
  --grey:#B3ADBD;
  --dim:#8C8598;
  --line:rgba(255,255,255,.13);
  --ui:'Archivo',"Segoe UI",system-ui,-apple-system,sans-serif;
  --timer:'Pricedown','Anton',"Haettenschweiler",'Archivo',sans-serif;
  --neon-soft:
    0 0 1px   rgba(255,255,255,.9),
    0 0 10px  rgba(255, 45,170,.55),
    0 0 26px  rgba(170, 42,198,.28);
  --word:#C8102E;
  --word-glow:rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--black);color:var(--white);
  font-family:var(--ui);line-height:1.6;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
::selection{background:var(--pink);color:#fff}

.shot{
  position:fixed;inset:-4%;background:#0A0910 center/cover no-repeat;
  animation:drift 14s cubic-bezier(.2,.6,.3,1) both;
}
@keyframes drift{from{transform:scale(1.08)}to{transform:scale(1)}}
/* GTA drains the colour out when it all goes wrong */
body[data-kind="wasted"] .shot{filter:grayscale(1) contrast(1.08) brightness(.8)}
body[data-kind="busted"] .shot{filter:saturate(.55) brightness(.7)}

.veil{
  position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(closest-side at 50% 46%,rgba(6,6,9,.5),rgba(6,6,9,.28) 55%,transparent),
    linear-gradient(180deg,rgba(6,6,9,.55),rgba(6,6,9,.15) 35%,rgba(6,6,9,.25) 55%,rgba(6,6,9,.9)),
    radial-gradient(90% 70% at 50% 46%,transparent 30%,rgba(6,6,9,.7) 100%);
}
/* A Florida patrol car's light bar, just out of shot above the frame: red on
   the driver's side, blue on the passenger's, each firing a quick burst of
   four before handing over to the other, then a beat where both sides
   pop together. Every flash eases on and off in ~40ms like an LED head,
   rather than snapping, and the light pours in from the top corners. */
.siren{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;display:none}
.siren.red{
  background:
    radial-gradient(70% 95% at 4% -10%,rgba(255,22,44,.95),rgba(255,22,44,.32) 40%,transparent 75%),
    linear-gradient(90deg,rgba(255,22,44,.16),transparent 60%);
}
/* blue reads far dimmer than red at the same strength, so it runs hotter */
.siren.blue{
  background:
    radial-gradient(70% 95% at 96% -10%,rgba(70,135,255,1),rgba(55,115,255,.55) 40%,transparent 78%),
    linear-gradient(270deg,rgba(55,115,255,.28),transparent 62%);
}
body[data-kind="busted"] .siren{display:block}
body[data-kind="busted"] .siren.red{animation:sirenRed 1.6s linear infinite}
body[data-kind="busted"] .siren.blue{animation:sirenBlue 1.6s linear infinite}
/* 1.6s cycle: red x4 (0-30%), blue x4 (34-64%), both x2 (70-90%), rest */
@keyframes sirenRed{
  0%{opacity:0} 2%{opacity:1} 5%{opacity:1} 7.5%{opacity:0}
  9%{opacity:0} 11%{opacity:1} 14%{opacity:1} 16.5%{opacity:0}
  18%{opacity:0} 20%{opacity:1} 23%{opacity:1} 25.5%{opacity:0}
  27%{opacity:0} 29%{opacity:1} 32%{opacity:1} 34.5%{opacity:0}
  70%{opacity:0} 72%{opacity:.85} 76%{opacity:.85} 78.5%{opacity:0}
  81%{opacity:0} 83%{opacity:.85} 87%{opacity:.85} 89.5%{opacity:0}
  100%{opacity:0}
}
@keyframes sirenBlue{
  0%,34%{opacity:0} 36%{opacity:1} 39%{opacity:1} 41.5%{opacity:0}
  43%{opacity:0} 45%{opacity:1} 48%{opacity:1} 50.5%{opacity:0}
  52%{opacity:0} 54%{opacity:1} 57%{opacity:1} 59.5%{opacity:0}
  61%{opacity:0} 63%{opacity:1} 66%{opacity:1} 68.5%{opacity:0}
  70%{opacity:0} 72%{opacity:.85} 76%{opacity:.85} 78.5%{opacity:0}
  81%{opacity:0} 83%{opacity:.85} 87%{opacity:.85} 89.5%{opacity:0}
  100%{opacity:0}
}

.wrap{
  position:relative;z-index:2;min-height:100%;
  display:grid;place-content:center;text-align:center;
  padding:48px clamp(16px,5vw,68px) max(48px,env(safe-area-inset-bottom));
}
.word{
  margin:0;font-family:var(--timer);font-weight:400;
  font-size:clamp(64px,15vw,190px);line-height:.95;letter-spacing:.02em;
  color:var(--word);
  text-shadow:0 0 2px #000,3px 3px 0 #000,0 0 30px var(--word-glow),0 0 70px rgba(0,0,0,.6);
  opacity:0;animation:word 1.3s cubic-bezier(.16,1,.3,1) .55s forwards;
}
@keyframes word{from{opacity:0;transform:scale(1.25);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
body[data-kind="busted"]{--word:#3B7BFF}

.code{
  margin:clamp(18px,2.6vw,28px) 0 0;font-size:clamp(10px,1.2vw,12px);font-weight:800;
  letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:var(--grey);
  text-shadow:0 1px 10px rgba(0,0,0,.9);
}
.line{
  max-width:46ch;margin:12px auto 0;font-size:clamp(15px,1.8vw,18px);font-weight:500;
  color:#E8E4EE;text-wrap:balance;text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 18px rgba(0,0,0,.75);
}
.fade{opacity:0;animation:fade .9s ease 1.25s forwards}
@keyframes fade{to{opacity:1}}

.eta{
  margin:clamp(28px,4vw,40px) auto 0;font-size:clamp(11px,1.3vw,13px);font-weight:700;
  letter-spacing:.24em;text-transform:uppercase;text-shadow:var(--neon-soft);
  font-variant-numeric:tabular-nums;
}
.eta:empty{display:none}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:22px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:14px 22px;
  border:1px solid var(--line);border-radius:2px;background:rgba(12,10,18,.6);backdrop-filter:blur(10px);
  font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--grey);
  transition:border-color .18s,color .18s,background .18s;
}
.btn:hover{border-color:rgba(255,45,170,.5);color:var(--white);background:rgba(255,45,170,.1)}
.btn.main{border-color:rgba(255,45,170,.6);color:var(--white)}
.btn.main:hover{background:rgba(255,45,170,.18)}

.legal{
  position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));z-index:2;
  text-align:center;font-size:10.5px;color:var(--dim);padding:0 16px;
}

@media (prefers-reduced-motion:reduce){
  .shot,.word,.fade{animation:none;opacity:1}
  /* no flashing: both heads held on, dimmed */
  body[data-kind="busted"] .siren.red,body[data-kind="busted"] .siren.blue{animation:none;opacity:.45}
}
@media (max-height:520px){
  .wrap{padding-top:24px;padding-bottom:40px}
  .legal{display:none}
}
</style>
</head>
<body data-kind="wasted">
<div class="shot" id="shot" aria-hidden="true"></div>
<div class="siren red" aria-hidden="true"></div>
<div class="siren blue" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<main class="wrap">
  <h1 class="word" id="word">Wasted</h1>
  <p class="code fade">Error 404 &middot; Page not found</p>
  <p class="line fade" id="line">You took a wrong turn somewhere off the Overseas Highway. This page doesn't exist.</p>
  <p class="eta fade" id="eta" aria-live="off"></p>
  <div class="actions fade">
    <a class="btn main" href="./">Respawn at the countdown</a>
  </div>
</main>

<p class="legal">Unofficial fan countdown. Not affiliated with Rockstar Games or Take-Two Interactive.</p>

<script>
/* Two ways it can go wrong in Leonida; one is picked per visit. */
var ENDINGS = [
  { kind:'wasted', word:'Wasted', img:'assets/finale/screens/vice-city-09.webp',
    line:"You took a wrong turn somewhere off the Overseas Highway. This page doesn't exist." },
  { kind:'busted', word:'Busted', img:'assets/finale/screens/vice-city-06.webp',
    line:'The VCPD picked this page up on Ocean Drive. Nobody has seen it since.' }
];
var pick = ENDINGS[Math.floor(Math.random() * ENDINGS.length)];
document.body.setAttribute('data-kind', pick.kind);
document.getElementById('word').textContent = pick.word;
document.getElementById('line').textContent = pick.line;
document.getElementById('shot').style.backgroundImage = 'url("' + pick.img + '")';
document.title = pick.word + ' | VI Countdown';

/* A small consolation: how long until it unlocks here, at local midnight. */
(function(){
  var eta = document.getElementById('eta');
  var target = new Date(2026, 10, 19, 0, 0, 0).getTime();
  function pad(n){ return n < 10 ? '0' + n : String(n); }
  function tick(){
    var t = target - Date.now();
    if (t <= 0){ eta.textContent = 'Vice City is open'; return; }
    var d = Math.floor(t / 86400000), h = Math.floor(t / 3600000) % 24,
        m = Math.floor(t / 60000) % 60, s = Math.floor(t / 1000) % 60;
    eta.textContent = 'Vice City opens in ' + d + 'd ' + pad(h) + ':' + pad(m) + ':' + pad(s);
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }
  tick();
})();
</script>
</body>
</html>
